name: Build Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: |
          flutter pub get
          cd packages/credit_calc_core
          flutter pub get

      - name: Build release APK (arm64 per installazione diretta)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/CreditCalc-${VERSION}-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreditCalc-Android
          path: dist/CreditCalc-*-android-arm64.apk
          retention-days: 30

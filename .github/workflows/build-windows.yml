name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install MSVC ATL/MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Write-Host "VS install path: $installPath"
          & $installer modify --installPath $installPath --add Microsoft.Visual Studio.Component.VC.ATLMFC --quiet --norestart --wait

      - name: Build release and installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows_release.ps1

      - name: Upload installer and app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CreditCalc-Windows
          path: |
            dist/*-Setup.exe
            dist/*-win64/
          retention-days: 30

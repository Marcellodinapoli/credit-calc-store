name: Build Windows

on:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Ensure MSVC ATL/MFC
        shell: pwsh
        run: |
          $atl = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022",
            "${env:ProgramFiles}\Microsoft Visual Studio\18",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022"
          ) | ForEach-Object {
            Get-ChildItem "$_\*\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
          } | Select-Object -First 1

          if ($atl) {
            Write-Host "ATL già presente: $($atl.FullName)"
            exit 0
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Write-Host "Installo ATL/MFC in: $installPath"
          & $installer modify `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --norestart --wait
          if ($LASTEXITCODE -notin 0, 3010) {
            Write-Warning "vs_installer exit code $LASTEXITCODE"
          }

          $atl = Get-ChildItem "$installPath\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $atl) {
            throw "ATL headers non trovati in $installPath"
          }
          Write-Host "ATL header: $($atl.FullName)"

      - name: Flutter pub get
        run: |
          flutter pub get
          cd packages\credit_calc_core
          flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows_release.ps1 -PackageOnly

      - name: Upload installer and app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CreditCalc-Windows
          path: |
            dist/*-Setup.exe
            dist/*-win64/
          retention-days: 30
